apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: netscope
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  NETSCOPE_ENV: "production"
  NETSCOPE_PORT: "8000"
  DATABASE_URL: "postgresql://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ .Release.Name }}-postgresql:5432/{{ .Values.postgresql.auth.database }}"
  REDIS_URL: "redis://{{ .Release.Name }}-redis-master:6379/0"
  CELERY_BROKER_URL: "redis://{{ .Release.Name }}-redis-master:6379/1"
  CELERY_RESULT_BACKEND: "redis://{{ .Release.Name }}-redis-master:6379/2"

