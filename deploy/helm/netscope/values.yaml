replicaCount: 2

image:
  backend:
    repository: netscope/backend
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  frontend:
    repository: netscope/frontend
    pullPolicy: IfNotPresent
    tag: "1.0.0"

service:
  type: ClusterIP
  backendPort: 8000
  frontendPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: netscope.local
      paths:
        - path: /api
          pathType: Prefix
          service: backend
        - path: /
          pathType: Prefix
          service: frontend
  tls:
    - secretName: netscope-tls
      hosts:
        - netscope.local

resources:
  backend:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  frontend:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

postgresql:
  enabled: true
  auth:
    username: netscope
    password: change-me-in-production
    database: netscope_db

redis:
  enabled: true
  architecture: standalone
