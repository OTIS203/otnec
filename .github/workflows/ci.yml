name: NetScope Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  agent-lint-and-test:
    name: Go Agent (Lint, Test & Vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.mod

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Go Format & Vet
        run: |
          cd agent
          go vet ./...

      - name: Go Tests with Coverage
        run: |
          cd agent
          go test -v -race -coverprofile=coverage.out ./...

  backend-lint-and-test:
    name: Backend API & ML (Ruff, Mypy, Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-cov

      - name: Lint with Ruff
        run: |
          cd backend
          ruff check app/ tests/

      - name: Run Pytest
        run: |
          cd backend
          pytest -v --cov=app tests/

  frontend-lint-and-test:
    name: Frontend Next.js (ESLint, Vitest & Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint

      - name: Test
        run: |
          cd frontend
          npm test -- --run

      - name: Production Build
        run: |
          cd frontend
          npm run build
